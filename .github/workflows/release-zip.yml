name: Create release zip on ddos-sim-demo push

on:
  push:
    branches: [ ddos-sim-demo ]

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create zip
        run: |
          zip -r ddos-sim-${{ github.sha }}.zip . -x ".git/*" "node_modules/*" "**/ddos-sim-*.zip"

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.sha }}
          release_name: Release ${{ github.sha }}
          draft: false
          prerelease: false

      - name: Upload zip to release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./ddos-sim-${{ github.sha }}.zip
          asset_name: ddos-sim-${{ github.sha }}.zip
          asset_content_type: application/zip
